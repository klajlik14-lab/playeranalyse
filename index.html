<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analýza hráče</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #333;
            overflow-x: hidden;
        }

        /* Flexbox kontejner: drží sidebar a graf VEDLE SEBE */
        .container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            min-height: 100vh;
        }

        /* Levý sloupec s pevnou šířkou */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background-color: #ffffff;
            border-right: 1px solid #e2e8f0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.02);
        }

        .sidebar h1 {
            font-size: 1.35rem;
            color: #1e293b;
            margin-bottom: 4px;
        }

        #statusMessage {
            font-size: 0.85rem;
            color: #dc2626;
            background: #fef2f2;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #fecaca;
        }

        /* Filtry hezky pod sebou */
        .filters {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .filters select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #ffffff;
            font-size: 0.95rem;
            color: #334155;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .filters select:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .filters select:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        /* Pravá část s grafem – flexibilní a s pevnou výškou pro canvas */
        .chart-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            min-height: 100vh;
            position: relative;
        }

        #pizzaChart {
            width: 100% !important;
            height: 100% !important;
            max-width: 780px;
            max-height: 780px;
        }
        /* Karta profilu v sidebaru */
        .player-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #0f172a;
        }

        .card-subtitle {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            margin-top: -6px;
        }

        .card-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }

        .card-stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #94a3b8;
            font-weight: 600;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1e293b;
        }

        .card-cards-row {
            display: flex;
            gap: 14px;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }

        .card-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
        }

        /* Piktogramy karet */
        .card-icon {
            width: 13px;
            height: 18px;
            border-radius: 2px;
            display: inline-block;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .yellow-card {
            background-color: #facc15;
            border: 1px solid #eab308;
        }

        .red-card {
            background-color: #ef4444;
            border: 1px solid #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h1>Analýza hráče</h1>
        <div id="statusMessage">Chyba: Nepodařilo se načíst soubor data.csv.</div>

        <div class="filters">
            <select id="kategorie" disabled>
                <option value="">-- Vyber kategorii --</option>
            </select>
            <select id="klub" disabled>
                <option value="">-- Vyber klub --</option>
            </select>
            <select id="hrac" disabled>
                <option value="">-- Vyber hráče --</option>
            </select>
        </div>
        <div id="playerCard" class="player-card" style="display: none;">
                <div class="card-name" id="cardName">-</div>
                <div class="card-subtitle" id="cardPosAge">-</div>

                <div class="card-stats-grid">
                    <div class="card-stat-item">
                        <span class="stat-label">Minuty / Zápasy</span>
                        <span class="stat-value" id="cardMinutes">-</span>
                    </div>
                    <div class="card-stat-item">
                        <span class="stat-label">Góly / xG</span>
                        <span class="stat-value" id="cardGoalsXg">-</span>
                    </div>
                </div>

                <div class="card-cards-row">
                    <div class="card-pill">
                        <span class="card-icon yellow-card"></span>
                        <span id="cardYellow">0</span>
                    </div>
                    <div class="card-pill">
                        <span class="card-icon red-card"></span>
                        <span id="cardRed">0</span>
                    </div>
                </div>
            </div>
    </div>

    <div class="chart-container">
        <canvas id="pizzaChart"></canvas>
    </div>
</div>
    
<script>
    Chart.register(ChartDataLabels);

    let parsedData = []; 
    let pizzaChartInstance = null;

    // 1. ZDE DEFINUJEME PŘESNÉ NÁZVY Z CSV (Vygenerované Google makrem)
    const metricKeys = [
        // --- OBRANA (Zelená barva) ---
        'Successful defensive actions per 90', 'Defensive duels won %', 'PAdj Interceptions', 'Aerial duels won %',
        // --- KREATIVITA & POHYB (Oranžová barva) ---
        'xA per 90', 'Progressive runs per 90', 'Dribbles per 90', 'Smart passes per 90',
        // --- DISTRIBUCE (Modrá barva) ---
        'Accurate long passes %', 'Progressive passes per 90', 'Accurate progressive passes %', 'Accurate passes %',
        // --- ÚTOK (Fialová barva) ---
        'xG per 90', 'Shots per 90', 'Touches in box per 90', 'Offensive duels won %'
    ];

    // 2. TEXTY PRO GRAF (Rozdělené do polí kvůli zalamování řádků)
    const labels = [
        ['Succ. def.', 'actions / 90'], ['Defensive', 'duels won %'], ['PAdj', 'Interceptions'], ['Aerial', 'duels won %'],
        ['xA', 'per 90'], ['Progressive', 'runs / 90'], ['Dribbles', 'per 90'], ['Smart', 'passes / 90'],
        ['Acc. long', 'passes %'], ['Progressive', 'passes / 90'], ['Acc. prog.', 'passes %'], ['Accurate', 'passes %'],
        ['xG', 'per 90'], ['Shots', 'per 90'], ['Touches', 'in box / 90'], ['Offensive', 'duels won %']
    ];

    const backgroundColors = [
        'rgba(46, 204, 113, 0.7)', 'rgba(46, 204, 113, 0.7)', 'rgba(46, 204, 113, 0.7)', 'rgba(46, 204, 113, 0.7)', 
        'rgba(230, 126, 34, 0.7)', 'rgba(230, 126, 34, 0.7)', 'rgba(230, 126, 34, 0.7)', 'rgba(230, 126, 34, 0.7)', 
        'rgba(52, 152, 219, 0.7)', 'rgba(52, 152, 219, 0.7)', 'rgba(52, 152, 219, 0.7)', 'rgba(52, 152, 219, 0.7)', 
        'rgba(155, 89, 182, 0.7)', 'rgba(155, 89, 182, 0.7)', 'rgba(155, 89, 182, 0.7)', 'rgba(155, 89, 182, 0.7)' 
    ];
    const borderColors = backgroundColors.map(color => color.replace('0.7', '1'));

    let currentPercentiles = Array(16).fill(0);
    let currentRawValues = Array(16).fill('');

    function initChart() {
        const ctx = document.getElementById('pizzaChart').getContext('2d');
        pizzaChartInstance = new Chart(ctx, {
            type: 'polarArea',
            data: {
                labels: labels,
                datasets: [
                    {
                        data: currentPercentiles,
                        backgroundColor: backgroundColors,
                        borderColor: borderColors,
                        borderWidth: 1.5,
                        datalabels: {
                            labels: {
                                valueBox: {
                                    align: 'center', anchor: 'center', backgroundColor: 'white', borderColor: '#333',
                                    borderWidth: 1, borderRadius: 4, color: '#333', font: { weight: 'bold', size: 11 },
                                    padding: { top: 4, bottom: 4, left: 6, right: 6 },
                                    formatter: function(value, context) {
                                        return currentRawValues[context.dataIndex] || '';
                                    }
                                }
                            }
                        }
                    },
                    {
                        data: Array(16).fill(100),
                        backgroundColor: 'rgba(0,0,0,0)', borderColor: 'rgba(0,0,0,0)', borderWidth: 0,
                        datalabels: {
                            labels: {
                                nameLabel: {
                                    align: 'end', anchor: 'end', offset: 5, textAlign: 'center',
                                    color: function(context) { return borderColors[context.dataIndex]; },
                                    font: { weight: '600', size: 12 },
                                    formatter: function(value, context) { return context.chart.data.labels[context.dataIndex]; },
                                    rotation: function(context) {
                                        const total = context.chart.data.labels.length;
                                        const step = 360 / total;
                                        let angle = (context.dataIndex * step) + (step / 2) - 90;
                                        let tangentialAngle = angle + 90;
                                        let normalizedAngle = (tangentialAngle % 360 + 360) % 360;
                                        if (normalizedAngle > 90 && normalizedAngle < 270) { return tangentialAngle + 180; }
                                        return tangentialAngle;
                                    }
                                }
                            }
                        }
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false, layout: { padding: 70 },
                interaction: { mode: 'index', intersect: true },
                scales: {
                    r: { min: 0, max: 100, ticks: { stepSize: 20, display: false }, grid: { color: 'rgba(0, 0, 0, 0.1)' }, angleLines: { display: true, color: 'rgba(0, 0, 0, 0.1)' } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        displayColors: false,
                        filter: function(tooltipItem) { return tooltipItem.datasetIndex === 0; },
                        callbacks: {
                            label: function(context) {
                                let index = context.dataIndex;
                                // Spojíme popisek (který je jako pole slov) do jednoho textu s mezerou
                                let metricName = context.chart.data.labels[index].join(' ');
                                let percentile = context.raw; 
                                let realValue = currentRawValues[index]; 
                                
                                return `${metricName}: ${realValue} (${percentile}. PR)`;
                            }
                        }
                    }
                }
            }
        });
    }

    // ODKAZ NA TVÁ DATA V GOOGLE TABULKÁCH
    const googleSheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTtgZg75pP-MytWN3ATzxRtVhR8oh1RuozT_kc82dLyYqGKLKk_WTSCcdR_mMRYJ7aFrTbXjLel6v_B/pub?gid=35253027&single=true&output=csv';

    function loadDefaultCSV() {
        Papa.parse(googleSheetUrl, {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: function(results) {
                parsedData = results.data;
                populateKategorie();
                document.getElementById('statusMessage').style.display = 'none';
            },
            error: function(err) {
                console.error("Chyba při načítání souboru:", err);
                document.getElementById('statusMessage').textContent = 'Chyba: Nepodařilo se stáhnout data z Google Tabulek.';
                document.getElementById('statusMessage').style.display = 'block';
            }
        });
    }

const elKat = document.getElementById('kategorie');
    const elKlub = document.getElementById('klub');
    const elHrac = document.getElementById('hrac');

    function getUniqueValues(data, key) {
        return [...new Set(data.map(item => item[key]))].filter(val => val != null);
    }

    function populateKategorie() {
        const kategorie = getUniqueValues(parsedData, 'Kategorie');
        elKat.innerHTML = '<option value="">-- Vyber kategorii --</option>';
        kategorie.forEach(kat => { elKat.innerHTML += `<option value="${kat}">${kat}</option>`; });
        elKat.disabled = false; elKlub.disabled = true; elHrac.disabled = true;
        elKlub.innerHTML = '<option value="">-- Vyber klub --</option>'; elHrac.innerHTML = '<option value="">-- Vyber hráče --</option>';
    }

    elKat.addEventListener('change', function() {
        document.getElementById('playerCard').style.display = 'none';
        const val = this.value;
        if (!val) { elKlub.disabled = true; return; }
        const filtered = parsedData.filter(d => d.Kategorie === val);
        
        // ZMĚNA: Hledáme sloupec Team místo Klub
        const kluby = getUniqueValues(filtered, 'Team');
        
        elKlub.innerHTML = '<option value="">-- Vyber klub --</option>';
        kluby.forEach(klub => { elKlub.innerHTML += `<option value="${klub}">${klub}</option>`; });
        elKlub.disabled = false; elHrac.disabled = true;
        elHrac.innerHTML = '<option value="">-- Vyber hráče --</option>';
    });

    elKlub.addEventListener('change', function() {
        document.getElementById('playerCard').style.display = 'none';
        const valKat = elKat.value;
        const valKlub = this.value;
        if (!valKlub) { elHrac.disabled = true; return; }
        
        // ZMĚNA: Filtrujeme podle Team
        const filtered = parsedData.filter(d => d.Kategorie === valKat && d.Team === valKlub);
        
        elHrac.innerHTML = '<option value="">-- Vyber hráče --</option>';
        
        filtered.forEach(d => {
            // Skryje slovo "Polař" v U15, ale ponechá "Brankář"
            let posText = '';
            if (valKat === 'U15') {
                posText = (d.Pozice === 'Brankář') ? ' (Brankář)' : '';
            } else if (d.Pozice) {
                posText = ` (${d.Pozice})`;
            }

            elHrac.innerHTML += `<option value="${d.Player}">${d.Player}${posText}</option>`;
        });
        elHrac.disabled = false;
    });

    elHrac.addEventListener('change', function() {
        const hracJmeno = this.value;
        if (!hracJmeno) {
            document.getElementById('playerCard').style.display = 'none';
            return;
        }

        const playerData = parsedData.find(d => d.Player === hracJmeno && d.Team === elKlub.value && d.Kategorie === elKat.value);
        if (!playerData) return;

        // 1. ZOBRAZENÍ A NAPLNĚNÍ KARTY HRÁČE
        const card = document.getElementById('playerCard');
        card.style.display = 'flex';

        document.getElementById('cardName').textContent = playerData.Player || '-';

        // Ošetření pozice na kartě (pro U15 skryje "Polař")
        const wyscoutPos = playerData.OriginalPosition || playerData.Pozice || '';
        const age = playerData.Age ? `${playerData.Age} let` : '';
        let displayPos = playerData.Pozice || '';
        if (playerData.Kategorie === 'U15' && displayPos !== 'Brankář') {
            displayPos = '';
        }
        const posLabel = displayPos ? `${wyscoutPos} (${displayPos})` : wyscoutPos;
        document.getElementById('cardPosAge').textContent = posLabel ? `${posLabel} • ${age}` : age;

        // Minuty a zápasy
        const mins = playerData['Minutes played'] || 0;
        const matches = playerData['Matches played'] || 0;
        document.getElementById('cardMinutes').textContent = `${mins}' / ${matches} záp.`;

        // Góly a xG
        const goals = playerData['Goals_val'] !== undefined ? playerData['Goals_val'] : 0;
        const xg = playerData['xG_val'] !== undefined ? playerData['xG_val'] : 0;
        document.getElementById('cardGoalsXg').textContent = `${goals} (${xg} xG)`;

        // Karty
        document.getElementById('cardYellow').textContent = playerData['Yellow cards_val'] || 0;
        document.getElementById('cardRed').textContent = playerData['Red cards_val'] || 0;

        // 2. AKTUALIZACE PIZZA GRAFU
        currentPercentiles = metricKeys.map(key => playerData[key + '_pct'] || 0);
        currentRawValues = metricKeys.map(key => playerData[key + '_val'] !== undefined ? playerData[key + '_val'] : '');

        pizzaChartInstance.data.datasets[0].data = currentPercentiles;
        pizzaChartInstance.update();
    });

    window.onload = function() {
        initChart();
        loadDefaultCSV();
    };

</script>
</body>
</html>
